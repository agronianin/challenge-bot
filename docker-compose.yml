services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-challenge}
      POSTGRES_USER: ${DB_USER:-challenge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-challenge}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-challenge} -d ${DB_NAME:-challenge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    image: challenge-bot:local
    build: .
    env_file: .local/runtime.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: "jdbc:postgresql://postgres:5432/${DB_NAME:-challenge}"
      LOG_DIR: "/app/logs"
      SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/app/external-config/"
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "127.0.0.1:5005:5005"
    volumes:
      - ./.local/config:/app/external-config:ro
      - ./.local/logs:/app/logs
      - ./.local/datasets/exercises/videos:/app/videos:ro

  migrate:
    image: liquibase/liquibase:4.32
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .local/runtime.env
    working_dir: /workspace
    volumes:
      - ./db/liquibase:/workspace/db/liquibase:ro
    command:
      - --url=jdbc:postgresql://postgres:5432/${DB_NAME:-challenge}
      - --username=${DB_USER:-challenge}
      - --password=${DB_PASSWORD:-challenge}
      - --changeLogFile=db/liquibase/changelog.xml
      - update

volumes:
  pgdata:
